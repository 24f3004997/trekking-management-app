{% extends 'base.html' %}
{% block content %}

<div class="row">
    {% include 'admin_sidebar.html' %}

    <div class="col-md-10">
        <h3>{% if trek %}Edit Trek{% else %}Add New Trek{% endif %}</h3>

        <form method="POST" class="mt-3">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Trek Name</label>
                    <input type="text" name="name" class="form-control"
                           value="{{ trek.name if trek else '' }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Location</label>
                    <input type="text" name="location" class="form-control"
                           value="{{ trek.location if trek else '' }}" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Start Date</label>
                    <input type="date" name="start_date" class="form-control"
                           value="{{ trek.start_date if trek else '' }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>End Date</label>
                    <input type="date" name="end_date" class="form-control"
                           value="{{ trek.end_date if trek else '' }}" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Difficulty</label>
                    <select name="difficulty" class="form-control" required>
                        <option value="Easy" {% if trek and trek.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
                        <option value="Moderate" {% if trek and trek.difficulty == 'Moderate' %}selected{% endif %}>Moderate</option>
                        <option value="Hard" {% if trek and trek.difficulty == 'Hard' %}selected{% endif %}>Hard</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Assign Staff</label>
                    <select name="assigned_staff_id" class="form-control">
                        <option value="">-- Select Staff --</option>
                        {% for s in staff_list %}
                        <option value="{{ s.id }}"
                            {% if trek and trek.assigned_staff_id == s.id %}selected{% endif %}>
                            {{ s.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label>Duration (Days)</label>
                    <input type="number" name="duration_days" class="form-control"
                           value="{{ trek.duration_days if trek else '' }}" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label>Available Slots</label>
                    <input type="number" name="available_slots" min="0" class="form-control" value="{{ trek.available_slots if trek else '' }}" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label>Status</label>
                    <select name="status" class="form-control" required>
                        {% for st in ['Pending', 'Approved', 'Open', 'Closed', 'Completed'] %}
                        <option value="{{ st }}" {% if trek and trek.status == st %}selected{% endif %}>{{ st }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label>Description</label>
                <textarea name="description" class="form-control" rows="3">{{ trek.description if trek else '' }}</textarea>
            </div>

            <a href="{{ url_for('admin_treks') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save</button>
        </form>
    </div>
</div>

{% endblock %}
