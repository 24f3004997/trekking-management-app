<!DOCTYPE html>
<html>
<head>
    <title>Trekking Management Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-light bg-light border-bottom px-3">
        <span class="navbar-brand">Trekking Management Application</span>
        {% if session.get('user_id') %}
        <span>
            {{ session.get('name') }} | <a href="{{ url_for('logout') }}">Logout</a>
        </span>
        {% endif %}
    </nav>

    <div class="container mt-4">

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %}
                    <div class="alert alert-info">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

</body>
</html>
