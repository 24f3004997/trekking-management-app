{% extends 'base.html' %}
{% block content %}

<div class="row">
    {% include 'user_sidebar.html' %}

    <div class="col-md-10">
        <h3>Trekking History</h3>

        <table class="table table-bordered mt-3">
            <thead>
                <tr>
                    <th>Trek Name</th>
                    <th>Trek Dates</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for b in history %}
                <tr>
                    <td>{{ b.trek.name }}</td>
                    <td>{{ b.trek.start_date.strftime('%d %b') }} - {{ b.trek.end_date.strftime('%d %b %Y') }}</td>
                    <td>{{ b.status }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

{% endblock %}
