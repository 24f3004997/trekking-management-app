{% extends 'base.html' %}
{% block content %}

<div class="row">
    {% include 'admin_sidebar.html' %}

    <div class="col-md-10">
        <h3>All Bookings</h3>

        <table class="table table-bordered mt-3">
            <thead>
                <tr>
                    <th>Booking ID</th>
                    <th>User</th>
                    <th>Trek</th>
                    <th>Booking Date</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for b in bookings %}
                <tr>
                    <td>{{ b.id }}</td>
                    <td>{{ b.user.name }}</td>
                    <td>{{ b.trek.name }}</td>
                    <td>{{ b.booking_date.strftime('%d %b %Y') }}</td>
                    <td>{{ b.status }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

{% endblock %}
