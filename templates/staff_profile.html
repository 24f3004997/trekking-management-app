{% extends 'base.html' %}
{% block content %}
<div class="row">
    {% include 'staff_sidebar.html' %}
    <div class="col-md-10 p-4">
        <h3>My Profile</h3>

        <form method="POST" class="row mt-3">
            <div class="col-md-6 mb-3">
                <label>Name</label>
                <input type="text" name="name" class="form-control" value="{{ staff.name }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label>Contact</label>
                <input type="text" name="contact" class="form-control" value="{{ staff.contact or '' }}">
            </div>
            <div class="col-md-6 mb-3">
                <label>Email</label>
                <input type="email" class="form-control" value="{{ staff.email }}" disabled>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
